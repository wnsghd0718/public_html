<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>페이지를 찾을 수 없습니다 — 박준홍</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0A0B0D">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230A0B0D'/%3E%3Crect x='9' y='9' width='14' height='14' fill='none' stroke='%23F0A45B' stroke-width='1.6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    :root { --paper:#0A0B0D; --ink:#E8EBEE; --ink-2:#A7AEB7; --ink-3:#8A929C; --rule:#232830; --accent:#F0A45B; color-scheme: dark; }
    :root[data-theme="light"] { --paper:#F3F4F5; --ink:#0E1115; --ink-2:#4A525C; --ink-3:#5F6771; --rule:#D5D9DE; --accent:#B8611A; color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; word-break: keep-all; display: grid; place-items: center; padding: 24px 16px; position: relative; overflow: hidden; }
    body::before { content: ""; position: absolute; inset: 0; background-image: linear-gradient(var(--rule) 1px, transparent 1px), linear-gradient(90deg, var(--rule) 1px, transparent 1px); background-size: 48px 48px; opacity: .35; -webkit-mask-image: radial-gradient(circle at 50% 45%, #000 10%, transparent 70%); mask-image: radial-gradient(circle at 50% 45%, #000 10%, transparent 70%); pointer-events: none; }
    main { position: relative; max-width: 520px; text-align: center; }
    .k { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: .76rem; letter-spacing: .16em; color: var(--accent); }
    h1 { font-size: clamp(4.5rem, 20vw, 8rem); font-weight: 900; letter-spacing: -0.06em; line-height: 1; margin: 14px 0 6px; }
    h1 span { color: var(--accent); }
    p { color: var(--ink-2); line-height: 1.7; margin: 0 0 28px; }
    a { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 22px; border-radius: 999px; background: var(--ink); color: var(--paper); font-weight: 600; text-decoration: none; }
    a:hover { background: var(--accent); color: #160D04; }
  </style>
  <script>try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
  <main>
    <p class="k">ERROR 404 · ADDRESS NOT FOUND</p>
    <h1>4<span>0</span>4</h1>
    <p>찾으시는 페이지가 없습니다.<br>주소가 바뀌었거나 잘못 입력된 것 같습니다.</p>
    <a href="/">포트폴리오 첫 화면으로 <span aria-hidden="true">→</span></a>
  </main>
</body>
</html>
