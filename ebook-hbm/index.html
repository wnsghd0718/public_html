<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBM 투자 취급설명서 · E-Book</title>
    <meta name="description" content="AI 메모리 반도체(HBM) 투자 취급설명서를 책장 넘기듯 읽는 전자책 리더">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700;900&display=swap" rel="stylesheet">
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <!-- PageFlip -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
    <!-- 내장 전자책 데이터 -->
    <script src="./book-data.js"></script>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="bg-elements">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="container">
        <header class="glass-panel text-center">
            <span class="eyebrow">투자관리지침서</span>
            <h1 class="gradient-text">AI 메모리 반도체<br>HBM 투자 취급설명서</h1>
            <p class="subtitle">반도체 투자할 때 매번 반복하는 확인 과정을<br>제품 설명서 형식으로 정리한 20쪽 전자책</p>
            <p class="book-meta"><b>AI스마트워크 · 20212954</b><br>교육용 자료 · 특정 종목 투자 권유 아님</p>

            <div class="upload-section btn-row">
                <button id="open-book" class="upload-btn open-btn" type="button">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"></path><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"></path></svg>
                    <span>전자책 다시 열기</span>
                </button>
                <input type="file" id="pdf-upload" accept="application/pdf" class="hidden-input">
                <label for="pdf-upload" class="upload-btn ghost-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                    <span>다른 PDF 불러오기</span>
                </label>
                <a id="download" class="download-link" download>PDF로 내려받기</a>
                <div id="file-name" class="file-name"></div>
            </div>

            <div id="loading" class="loading-container" style="display: none;">
                <div class="spinner"></div>
                <p id="loading-text">전자책을 준비하는 중...</p>
                <div class="progress-bar">
                    <div id="progress" class="progress"></div>
                </div>
            </div>

            <nav id="toc" class="toc-mini" aria-label="장 바로가기"></nav>
        </header>

        <main id="book-area" style="display: none;">
            <div class="book-controls glass-panel">
                <button id="prev-btn" class="control-btn" aria-label="이전 쪽">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                </button>
                <span id="page-info" class="page-info">표지</span>
                <button id="next-btn" class="control-btn" aria-label="다음 쪽">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                </button>
            </div>

            <div class="book-wrapper">
                <div id="book"></div>
            </div>

            <div class="book-instructions">
                모서리를 끌거나 가장자리를 클릭해 넘기세요 · 키보드 ← → 도 됩니다
            </div>
        </main>
    </div>

    <script src="./script.js"></script>
</body>
</html>
